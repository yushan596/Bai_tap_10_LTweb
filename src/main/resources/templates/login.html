<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="min-height: 500px; max-width: 420px; margin-top: 80px">
  <h3 class="mb-3">Login</h3>
  <form onsubmit="return false;">
    <label class="form-label">Email</label>
    <input class="form-control mb-2" type="email" id="email" required>
    <label class="form-label">Password</label>
    <input class="form-control mb-3" type="password" id="password" required autocomplete="on">
    <button id="Login" type="button" class="btn btn-primary">Login</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
